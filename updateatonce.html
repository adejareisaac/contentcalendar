const log = document.getElementById('log');
function print(msg, cls='') {
  const span = document.createElement('span');
  span.className = cls;
  span.textContent = msg + '\n';
  log.appendChild(span);
}

window.runSeed = async function() {
  const btn = document.getElementById('run-btn');
  btn.disabled = true;
  log.innerHTML = '';

  print('🔍 Checking existing posts...', 'info');
  const existing = await getDocs(collection(db, 'posts'));
  if (!existing.empty) {
    print(`⚠️  Found ${existing.size} existing post(s). Clearing them first...`, 'info');
    for (const d of existing.docs) {
      await deleteDoc(doc(db, 'posts', d.id));
    }
    print('✓ Cleared existing posts.\n', 'ok');
  }

  print(`📦 Inserting ${POSTS.length} posts...\n`, 'info');

  let count = 0;
  for (const post of POSTS) {
    try {
      const ref = await addDoc(collection(db, 'posts'), post);
      count++;
      print(`✓ [${count}/${POSTS.length}] ${post.date} · ${post.type} · "${post.topic}" → ID: ${ref.id}`, 'ok');
    } catch(e) {
      print(`✗ FAILED: ${post.date} · ${post.topic} — ${e.message}`, 'err');
    }
  }

  print(`\n🎉 Done! ${count} posts inserted into Firestore.`, 'info');
  print('You can now open your content calendar. All data is live!', 'info');
  btn.textContent = '✓ Done!';
}
